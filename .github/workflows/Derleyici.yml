
name: CloudStream Derleyici

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.py"

permissions:
  contents: write

concurrency:
  group: cloudstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v6
        with:
          ref: master
          path: src

      - name: Builds dalını indir
        uses: actions/checkout@v6
        with:
          ref: builds
          path: builds
          fetch-depth: 0

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle ayarla
        uses: gradle/actions/setup-gradle@v5

      - name: Derle ve dosyaları kontrol et
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/src"

          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          chmod +x gradlew
          ./gradlew --version

          echo "===== DERLEME BAŞLADI ====="
          ./gradlew --no-daemon --stacktrace --info make makePluginsJson

          echo "===== CS3 DOSYALARI ====="
          find . -type f -name '*.cs3' -print

          mapfile -t FILES < <(find . -type f -path '*/build/*.cs3')

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::Hiçbir CS3 dosyası üretilmedi."
            exit 1
          fi

          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3

          for file in "${FILES[@]}"; do
            echo "Kopyalanıyor: $file"
            cp "$file" "$GITHUB_WORKSPACE/builds/"
          done

          if [ ! -f build/plugins.json ]; then
            echo "::error::src/build/plugins.json bulunamadı."
            find . -type f -name plugins.json -print
            exit 1
          fi

          cp build/plugins.json "$GITHUB_WORKSPACE/builds/"

          echo "===== BUILDS İÇERİĞİ ====="
          ls -lah "$GITHUB_WORKSPACE/builds"

      - name: Repo JSON kontrolü
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/builds"

          if [ ! -f repo.json ]; then
            echo "::error::builds dalında kök dizinde repo.json bulunamadı."
            pwd
            ls -lah
            exit 1
          fi

          sed -i 's/@KekikAkademi/@feroxxcs3/g' repo.json

          echo "===== REPO.JSON ====="
          cat repo.json

          echo "===== JSON DOĞRULAMA ====="
          python3 -m json.tool repo.json >/dev/null
          python3 -m json.tool plugins.json >/dev/null

      - name: Git durumunu göster
        if: always()
        shell: bash
        run: |
          echo "===== DOSYA KONTROLÜ ====="
          ls -lah "$GITHUB_WORKSPACE/builds" || true
          echo "===== ÇALIŞTIRMA BİLGİSİ ====="
          echo "Commit: $GITHUB_SHA"
          echo "Dal: $GITHUB_REF_NAME"

      - name: Derlemeleri builds dalına gönder
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/builds"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "CloudStream derlemesi ${GITHUB_SHA}"
          git push origin HEAD:builds

      - name: Hata raporu
        if: failure()
        shell: bash
        run: |
          {
            echo "## CloudStream derleme hatası"
            echo ""
            echo "- Kaynak commit: $GITHUB_SHA"
            echo "- Çalıştırma: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Başarısız adımın ayrıntılı loglarını yukarıdan inceleyin."
          } >> "$GITHUB_STEP_SUMMARY"
